# GitHub wylacza zaplanowane workflowy w repo bez aktywnosci przez 60 dni,
# co ubiloby keep-alive. Ten job raz w tygodniu robi commit ze znacznikiem czasu.
name: heartbeat

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zapisz znacznik czasu i wypchnij
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          git diff --staged --quiet || git commit -m "heartbeat"
          git push
